<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}旧仪器门户{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
           background: #f3f4f6; color: #1f2937; }
    header { background: #1e3a5f; color: #fff; padding: 14px 28px;
             display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    header nav a { color: #c7d7ea; margin-left: 18px; text-decoration: none; font-size: 14px; }
    main { max-width: 960px; margin: 28px auto; background: #fff; padding: 24px 28px;
           border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .flash.ok { background: #ecfdf5; color: #065f46; }
    .flash.error { background: #fef2f2; color: #991b1b; }
    .flash.warn { background: #fffbeb; color: #92400e; }
    label { display: block; font-size: 14px; margin: 12px 0 4px; }
    input, select { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px;
                    font-size: 14px; min-width: 220px; }
    button { background: #2563eb; color: #fff; border: 0; padding: 9px 20px;
             border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 16px; }
    button.secondary { background: #4b5563; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; }
    th, td { border: 1px solid #e5e7eb; padding: 7px 10px; text-align: left; }
    th { background: #f9fafb; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
    .badge.on { background: #fee2e2; color: #991b1b; }
    .badge.off { background: #dcfce7; color: #166534; }
    .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <h1>旧仪器检测门户（模拟）</h1>
    <nav>
      <a href="{{ url_for('index') }}">检测明细</a>
      <a href="{{ url_for('admin') }}">演示控制台</a>
      {% if session.get('token') %}
      <form method="post" action="{{ url_for('logout') }}" style="display:inline">
        <button class="secondary" type="submit" style="margin:0;padding:4px 12px">退出登录</button>
      </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
